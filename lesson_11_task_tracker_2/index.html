<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>Планировщик задач</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Мои задачи</h1>

        <div class="task-form">
            <input placeholder="Введите новую задачу" class="task-input"> 
            <button class="add-task-button">Добавить</button>
        </div>

        <div>
            <ul class="task-list">
                <li class="task">
                    <input type="checkbox">
                    <span class="task-title">Задача 1</span>
                    <button class="delete-button">Удалить</button>
                </li>
                 <li class="task">
                    <input type="checkbox">
                    <span class="task-title">Задача 2</span>
                    <button class="delete-button">Удалить</button>
                </li>
                 <li class="task">
                    <input type="checkbox">
                    <span class="task-title">Задача 3</span>
                    <button class="delete-button">Удалить</button>
                </li>
            </ul>
        </div>

        <div class="stats">
            Выполнено 1 из 3
        </div>
    </div>
</body>
