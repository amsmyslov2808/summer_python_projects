<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>Планировщик задач</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>Мои задачи</h1>

        <div class="task-form">
            <input placeholder="Введите новую задачу" class="task-input" id="taskInput">
            <button class="add-task-button" onclick="add_task_button_click()">Добавить</button>
        </div>

        <div>
            <ul class="task-list" id="tasklist">
            </ul>
        </div>

        <div class="stats" id="stats">
        </div>
    </div>
</body>
